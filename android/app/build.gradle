plugins {
    id "com.android.application"
    id "kotlin-android"
    // O plugin do Flutter precisa vir depois dos plugins do Android e do Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.smartsleep.smart_sleep"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.smartsleep.smart_sleep"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Assinatura de debug para permitir `flutter run --release` antes de
            // existir uma chave de release própria.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
